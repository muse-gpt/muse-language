name: check-rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Fetch media.rs sibling tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/muse-gpt/ucf.rs.git ../media.rs
          git -C ../media.rs checkout 59afb7d53ae4a3caff91d1db59a287f054cf9b33
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build workspace
        run: cargo build --release
      - name: Test workspace
        run: cargo test --release
