[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = ["projects/crates/muse-napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
authors = ["Muse contributors"]
repository = "https://github.com/muse-gpt/muse-language"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
chumsky = "1.0.0-alpha.8"
logos = "0.16"
miette = { version = "7.6", features = ["fancy", "serde"] }
rmcp = { version = "3.1", features = ["transport-io"] }
schemars = "1.2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
midly = "0.5"
hound = "3.5"
rusty_mp3 = "0.1.1"
rustysynth = "1.3.6"
sha2 = "0.10"
thiserror = "2.0"
# True VON only (not TOML). Pin past Option-serde fix; path overlay optional via .cargo/config.toml.
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c1ccd4edc36cd8aaacbc3ea5fc3072237778e342" }
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "wav"] }
ttf-parser = "0.25"
ab_glyph = "0.2"

wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1.22", features = ["derive"] }

muse-types = { path = "projects/crates/muse-types" }
muse-parser = { path = "projects/crates/muse-parser" }
muse-ir = { path = "projects/crates/muse-ir" }
muse-project = { path = "projects/crates/muse-project" }
muse-music = { path = "projects/crates/muse-music" }
muse-score = { path = "projects/crates/muse-score" }
muse-media = { path = "projects/crates/muse-media" }
muse-mcp = { path = "projects/crates/muse-mcp" }
muse-napi = { path = "projects/crates/muse-napi" }
napi = { version = "3", default-features = true, features = ["napi4", "serde-json"] }
napi-derive = "3"
napi-build = "2"

[profile.release]
lto = true
panic = "abort"
