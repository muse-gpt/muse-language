[workspace]
resolver = "2"
members = [
  "projects/muse-types",
  "projects/muse-parser",
  "projects/muse-ir",
  "projects/muse-project",
  "projects/muse-music",
  "projects/muse-score",
  "projects/muse-media",
  "projects/muse-mcp",
  "projects/muse-tools",
]
default-members = ["projects/muse-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Muse contributors"]
repository = "https://github.com/muse-lang/muse"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
chumsky = "1.0.0-alpha.8"
logos = "0.16"
miette = { version = "7.6", features = ["fancy", "serde"] }
rmcp = { version = "3.1", features = ["transport-io"] }
schemars = "1.2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
midly = "0.5"
hound = "3.5"
rusty_mp3 = "0.1.1"
rustysynth = "1.3.6"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "wav"] }

[profile.release]
lto = true
panic = "abort"
