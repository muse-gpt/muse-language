[package]
name = "muse-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
# Retained so downstream `--features gpu` keeps building. The wgpu backend was
# retired (contract 14 §1.2); the feature no longer pulls a GPU runtime.
gpu = []

[dependencies]
anyhow.workspace = true
image.workspace = true
geometry-types.workspace = true
media-image.workspace = true
media-codec.workspace = true
media-audio.workspace = true
media-post.workspace = true
media-text.workspace = true
media-types.workspace = true
muse-ir = { path = "../muse-ir" }
muse-types = { path = "../muse-types" }
serde.workspace = true
